# Builds the Windows wheel and publishes it to PyPI with trusted publishing
# (no API token stored in GitHub).
#   - Push a tag like v0.1.0 to publish to PyPI, then create a GitHub Release
#     with quillnotes.exe attached.
#   - Run the workflow by hand (Actions tab -> Release -> Run workflow) to
#     only build, as a check before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # PyPI versions can never be reused, so catch a mismatched tag before uploading.
      - name: Check the tag matches the Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python -c "import os, sys, tomllib; v = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']; t = os.environ['GITHUB_REF_NAME']; sys.exit(0 if t == 'v' + v else f'Tag {t} does not match Cargo.toml version {v}')"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist

      # Take the exe from the wheel so the release download is the same binary
      # pip installs. It goes in its own artifact so it isn't uploaded to PyPI.
      - name: Extract quillnotes.exe from the wheel
        shell: bash
        run: |
          python -c "import glob, zipfile; z = zipfile.ZipFile(glob.glob('dist/*.whl')[0]); n = next(n for n in z.namelist() if n.endswith('/scripts/quillnotes.exe')); open('quillnotes.exe', 'wb').write(z.read(n))"

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: quillnotes.exe

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" quillnotes.exe --repo "$GITHUB_REPOSITORY" --title "QuillNotes $GITHUB_REF_NAME" --generate-notes
